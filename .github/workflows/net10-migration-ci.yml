name: Build and release Switch-Toolbox .NET 10 (migration)
on:
  push:
    branches: [net10-slnx, net10-deps-refresh]
  workflow_dispatch:
  pull_request:
    branches: [master, net10-slnx]
permissions:
  contents: read
concurrency:
  group: switch-toolbox-net10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check SDK and solution
        shell: pwsh
        run: |
          dotnet --info
          dotnet sln Toolbox.slnx list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore SDK projects
        shell: pwsh
        run: |
          dotnet restore Toolbox.slnx --disable-parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build full .NET 10 solution
        shell: pwsh
        run: |
          dotnet build Toolbox.slnx -c Release --no-restore -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet publish Toolbox/Toolbox.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP/Toolbox-net10"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = "$env:RUNNER_TEMP/Toolbox-net10"
          if (!(Test-Path "$out/Toolbox.exe")) { throw 'Toolbox.exe missing' }
          if (!(Test-Path "$out/Toolbox.Library.dll")) { throw 'Toolbox.Library.dll missing' }
          New-Item -ItemType Directory -Path "$out/Lib/Plugins" -Force | Out-Null
          Copy-Item Toolbox/Lib/* "$out/Lib/" -Recurse -Force
          if (Test-Path Toolbox/Shader) {
            New-Item -ItemType Directory -Path "$out/Shader" -Force | Out-Null
            Copy-Item Toolbox/Shader/* "$out/Shader/" -Recurse -Force
          }
          if (Test-Path "$out/FirstPlugin.Plg.dll") {
            Copy-Item "$out/FirstPlugin.Plg.dll" "$out/Lib/Plugins/FirstPlugin.Plg.dll" -Force
          }
          if (Test-Path "$out/BrawlboxHelper.dll") {
            Copy-Item "$out/BrawlboxHelper.dll" "$out/Lib/BrawlboxHelper.dll" -Force
          }
          # Do not ship the old 3.0.1 OpenTK DLLs from the tracked Lib folder.
          foreach ($dll in @('OpenTK.dll', 'OpenTK.GLControl.dll')) {
            $root = Join-Path $out $dll
            if (!(Test-Path $root)) { throw "NuGet $dll is missing from publish root" }
            $actual = [System.Reflection.AssemblyName]::GetAssemblyName($root).Version
            if ($actual.Major -ne 3 -or $actual.Minor -ne 3 -or $actual.Build -ne 3) {
              throw "$dll has unexpected version $actual (expected 3.3.3.x)"
            }
            Copy-Item $root (Join-Path $out "Lib/$dll") -Force
            $pluginCopy = Join-Path $out "Lib/Plugins/$dll"
            if (Test-Path $pluginCopy) { Copy-Item $root $pluginCopy -Force }
          }
          Compress-Archive -Path "$out/*" -DestinationPath "$env:RUNNER_TEMP/Switch-Toolbox-net10-win-x64.zip" -Force
      - name: Runtime and format smoke test (Windows)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/Toolbox-net10"
          & dotnet "$out/Toolbox.dll" --migration-smoke
          if ($LASTEXITCODE -ne 0) { throw "Runtime smoke test failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: Switch-Toolbox-net10-win-x64
          path: ${{ runner.temp }}/Switch-Toolbox-net10-win-x64.zip
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/net10-slnx' || github.ref == 'refs/heads/net10-deps-refresh')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Switch-Toolbox-net10-win-x64
          path: dist
      - name: Publish validated .NET 10 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "net10-deps-refresh" ]]; then
            tag="net10-deps-${GITHUB_SHA:0:12}"
            title="Switch-Toolbox .NET 10 OpenTK 3.3.3 (experimental)"
            notes="Experimental dependency upgrade: OpenTK + GLControl 3.3.3 from NuGet. CI checks compilation, published DLL versions, format smoke and plugin discovery; real Windows OpenGL rendering and BFRES/BNTX files remain unvalidated."
          else
            tag="net10-${GITHUB_SHA:0:12}"
            title="Switch-Toolbox .NET 10 (experimental)"
            notes="Experimental .NET 10 Windows build; requires compatibility testing with legacy plugins and native DLLs."
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$tag" "dist/Switch-Toolbox-net10-win-x64.zip" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$title" \
            --notes "$notes" \
            --prerelease
